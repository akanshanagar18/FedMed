apiVersion: apps/v1
kind: Deployment
metadata:
  name: fedmed-dashboard
  namespace: fedmed
  labels:
    app.kubernetes.io/name: fedmed-dashboard
    app.kubernetes.io/component: dashboard
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: fedmed-dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fedmed-dashboard
        app.kubernetes.io/component: dashboard
    spec:
      containers:
        - name: dashboard
          image: fedmed/dashboard:2.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
