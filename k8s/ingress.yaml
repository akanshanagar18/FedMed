apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fedmed-ingress
  namespace: fedmed
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
    - hosts:
        - fedmed.internal
      secretName: fedmed-tls-secret
  rules:
    - host: fedmed.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: fedmed-dashboard
                port:
                  number: 80
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: fedmed-backend
                port:
                  number: 8000
          - path: /metrics
            pathType: Exact
            backend:
              service:
                name: fedmed-backend
                port:
                  number: 8000
