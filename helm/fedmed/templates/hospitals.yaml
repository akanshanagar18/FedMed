{{- if .Values.hospitals.enabled }}
{{- range .Values.hospitals.nodes }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $.Release.Name }}-{{ .id | replace "_" "-" }}
  namespace: {{ $.Values.namespace }}
  labels:
    app.kubernetes.io/name: {{ $.Release.Name }}-{{ .id | replace "_" "-" }}
    app.kubernetes.io/component: hospital-client
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $.Release.Name }}-{{ .id | replace "_" "-" }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $.Release.Name }}-{{ .id | replace "_" "-" }}
        app.kubernetes.io/component: hospital-client
    spec:
      containers:
        - name: hospital-client
          image: "{{ $.Values.image.repository }}/hospital-client:{{ $.Values.image.tag }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          command: ["python", "-m", "client.flower_client", "--hospital-id", "{{ .id }}"]
          envFrom:
            - configMapRef:
                name: {{ $.Release.Name }}-config
{{- end }}
{{- end }}
