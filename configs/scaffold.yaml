# FedMed v2.0 SCAFFOLD Strategy Configuration
# Reference: Karimireddy et al., ICML 2020

federated:
  strategy: "SCAFFOLD"
  num_rounds: 3
  min_clients: 2
  sample_fraction: 1.0
  batch_size: 2
  learning_rate: 0.0001
  local_epochs: 1
  weight_decay: 1e-4
  seed: 42

scaffold:
  control_variate_lr: 1.0
  server_learning_rate: 1.0
  server_momentum: 0.0
