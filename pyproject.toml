[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fedmed"
version = "2.0.0"
description = "Enterprise Federated AI Operating System for Medical Image Segmentation"
authors = [
    {name = "FedMed Core Architecture Team"}
]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0.0",
    "monai>=1.3.0",
    "flwr>=1.7.0",
    "fastapi>=0.104.0",
    "uvicorn>=0.23.2",
    "tenseal>=0.3.14",
    "numpy>=1.24.0",
    "nibabel>=5.1.0",
    "tensorboard>=2.14.0",
    "pydantic>=2.4.2",
    "pydantic-settings>=2.0.3",
    "websockets>=11.0.3",
    "sqlalchemy>=2.0.0",
    "requests>=2.31.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.2",
    "httpx>=0.25.0",
    "black>=23.9.1",
    "flake8>=6.1.0",
    "mypy>=1.5.1",
    "isort>=5.12.0"
]

[tool.setuptools.packages.find]
include = [
    "analytics*",
    "calibration*",
    "client*",
    "clinical*",
    "common*",
    "communication*",
    "configs*",
    "continual*",
    "dashboard*",
    "data*",
    "dataset*",
    "deployment*",
    "digital_twin*",
    "evaluation*",
    "events*",
    "experiments*",
    "explainability*",
    "fairness*",
    "foundation*",
    "governance*",
    "hpo*",
    "inference*",
    "knowledge*",
    "model*",
    "orchestrator*",
    "peft*",
    "privacy*",
    "resilience*",
    "scheduler*",
    "server*",
    "simulation*",
    "strategy*",
    "utils*",
    "workflows*"
]

[tool.black]
line-length = 120
target-version = ['py39']

[tool.isort]
profile = "black"
