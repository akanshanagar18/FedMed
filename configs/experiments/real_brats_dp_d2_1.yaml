# Configuration: configs/experiments/real_brats_dp_d2_1.yaml
# FEDMED OS — PHASE 10.10E / EXPERIMENT D2.1: REAL-DATA FEDAVG + SGD WITH MOMENTUM DP-SGD (lr=1e-3, C=0.06, Momentum=0.9)
# Canonical configuration for 4-Hospital BraTS-GLI 2024 Calibrated Learning Rate Benchmark

data:
  dataset_name: "BraTS-GLI"
  dataset_version: "2024"
  task: "adult_glioma_post_treatment"
  raw_data_dir: "data/raw/BraTS2024"
  split_file: "reports/real_brats2024/dataset_split.json"
  partitions_file: "reports/real_brats2024/hospital_partitions.json"
  modalities: ["t1", "t1ce", "t2", "flair"]
  labels:
    0: "Background"
    1: "NETC"
    2: "SNFH"
    3: "ET"
    4: "RC"
  target_classes:
    TC: [1, 3]
    WT: [1, 2, 3]
    ET: [3]

spatial_resolutions:
  development: [32, 32, 32]
  real_experiment: [128, 128, 128]

model:
  architecture: "MONAI 3D U-Net"
  spatial_dims: 3
  in_channels: 4
  out_channels: 3
  channels: [16, 32, 64, 128, 256]
  strides: [2, 2, 2, 2]
  num_res_units: 2
  dropout: 0.0
  total_parameters: 4810074

training:
  spatial_shape: [128, 128, 128]
  loss: "DiceCELoss"
  loss_function: "DiceCELoss"
  loss_params:
    sigmoid: true
    lambda_dice: 1.0
    lambda_ce: 0.2
  optimizer: "SGD"           # FROZEN FROM D2: SGD
  momentum: 0.9              # FROZEN FROM D2: Momentum = 0.9
  learning_rate: 0.001       # CAUSAL CHANGE: lr = 1e-3 (was 1e-4 in D2)
  weight_decay: 0.00001      # FROZEN: weight_decay = 1e-5
  batch_size: 1
  local_epochs: 1
  num_workers: 0
  device: "mps"

federated:
  strategy: "FedAvg"
  rounds: 20
  num_rounds: 20
  min_clients: 4
  clients_per_round: 4
  client_execution: "sequential"
  seed: 42
  hospitals:
    - "hospital_alpha"
    - "hospital_beta"
    - "hospital_gamma"
    - "hospital_delta"

privacy:
  mechanism: "DP-SGD"
  level: "sample_level"
  max_grad_norm: 0.06        # FROZEN FROM D1/D2: Calibrated C = 0.06
  noise_multiplier: 0.87     # FROZEN: sigma = 0.87
  target_delta: 0.00001      # FROZEN: delta = 1e-5
  sample_rate: 0.004237288   # FROZEN: 1 / 236 subjects per silo
  sampling_mechanism: "Poisson / Bernoulli Subsampling (q=1/236)"
  batch_semantics: "poisson_expected_batch_size_1"
  accountant: "Exact Analytical Rényi Differential Privacy (Poisson RDP)"
  calculated_epsilon_20_rounds: 2.8934
  optimal_alpha: 7

firewall:
  locked_test_cohort_size: 204
  allowed_training_test_accesses: 0

checkpoint:
  best_checkpoint_path: "checkpoints/fedavg_dp_d2_1/best.pt"
  latest_checkpoint_path: "checkpoints/fedavg_dp_d2_1/latest.pt"

reports:
  report_path: "reports/real_brats2024/fedavg_dp_d2_1.json"
  history_path: "reports/real_brats2024/fedavg_dp_d2_1_history.json"
  progress_path: "reports/real_brats2024/fedavg_dp_d2_1_progress.json"
  manifest_path: "reports/real_brats2024/dp_d2_1_experiment_manifest.json"
