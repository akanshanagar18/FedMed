apiVersion: apps/v1
kind: Deployment
metadata:
  name: fedmed-backend-server
  namespace: fedmed-system
  labels:
    app: fedmed-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fedmed-backend
  template:
    metadata:
      labels:
        app: fedmed-backend
    spec:
      containers:
      - name: backend
        image: fedmed/backend:v2.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        env:
        - name: DATABASE_URL
          value: "sqlite:////app/data/fedmed.db"
        livenessProbe:
          httpGet:
            path: /api/v1/health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/v1/health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          requests:
            cpu: "500m"
            memory: "1Gi"
          limits:
            cpu: "2000m"
            memory: "4Gi"
