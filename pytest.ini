[pytest]
minversion = 7.0
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --strict-markers
pythonpath = . dashboard/backend
markers =
    unit: Unit tests for core functions and models
    integration: Integration tests for FastAPI endpoints and DB
    e2e: End-to-End simulation smoke test
