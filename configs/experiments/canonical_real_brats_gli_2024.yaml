# =============================================================================
# FedMed OS — Canonical Real BraTS-GLI 2024 Experiment Configuration (Phase 9.2)
# Single Source of Truth for Real Multi-Hospital Federated Medical AI Experiments
# =============================================================================

experiment:
  name: "real_brats_gli_2024_federated"
  version: "2.0.0"
  description: "Canonical Federated BraTS-GLI 2024 Adult Glioma Segmentation using MONAI 3D UNet and FedAvg"
  dataset_target: "BraTS-GLI-2024"
  hardware_target: "Single_Node_Apple_Silicon_MPS"

spatial_resolutions:
  real_experiment: [128, 128, 128]  # Scientifically validated resolution for real tumor morphology
  development_ci: [32, 32, 32]      # Lightweight downsampled resolution for fast CI regression tests

model:
  name: "UNet3D"
  framework: "MONAI"
  spatial_dims: 3
  in_channels: 4
  out_channels: 3
  channels: [16, 32, 64, 128, 256]
  strides: [2, 2, 2, 2]
  num_res_units: 2
  dropout: 0.0
  total_parameters: 4810074

training:
  spatial_shape: [128, 128, 128]
  loss: "DiceCELoss"
  loss_params:
    sigmoid: true
    lambda_dice: 1.0
    lambda_ce: 0.2
  optimizer: "Adam"
  learning_rate: 0.0001
  weight_decay: 0.00001
  batch_size: 1
  local_epochs: 1
  num_workers: 0
  device: "mps"

federated:
  strategy: "FedAvg"
  client_execution: "sequential"     # Strictly sequential client execution to ensure zero MPS memory contention
  num_rounds: 20
  min_clients: 4
  min_available_clients: 4
  hospitals:
    - "hospital_alpha"
    - "hospital_beta"
    - "hospital_gamma"
    - "hospital_delta"
  seed: 42

data:
  dataset_name: "BraTS-GLI"
  dataset_version: "2024"
  dataset_task: "adult_glioma_post_treatment"
  data_dir: "data/raw/BraTS2024"
  modalities:
    - "t1"    # Channel 0: T1 native non-contrast (*-t1n.nii.gz)
    - "t1ce"  # Channel 1: T1 post-contrast Gadolinium (*-t1c.nii.gz)
    - "t2"    # Channel 2: T2 native (*-t2w.nii.gz)
    - "flair" # Channel 3: T2 FLAIR (*-t2f.nii.gz)
  mask_modality: "seg"
  target_classes:
    - "TC"  # Tumor Core (labels 1 + 3)
    - "WT"  # Whole Tumor (labels 1 + 2 + 3)
    - "ET"  # Enhancing Tumor (label 3)
  label_mapping:
    0: "Background"
    1: "NETC - Non-enhancing Tumor Core"
    2: "SNFH - Surrounding Non-enhancing FLAIR Hyperintensity"
    3: "ET - Enhancing Tumor"
    4: "RC - Resection Cavity (Preserved in provenance metadata, not predicted in 3-channel output)"
  split:
    total_subjects: 1350
    train_count: 944
    val_count: 202
    test_count: 204
    split_manifest: "reports/real_brats2024/dataset_split.json"
    partitions_manifest: "reports/real_brats2024/hospital_partitions.json"
    split_hash: "d0358ca42d4bf510624bbe7e86c3e4bc1e25a6174521b1280c0001eb2c66005c"

privacy:
  differential_privacy:
    enabled: false
    mechanism: "Sampled Gaussian Mechanism"
    accountant: "RDP (Renyi Differential Privacy) Accountant"
    max_grad_norm: 1.0
    noise_multiplier: 0.8
    target_delta: 0.00001
  homomorphic_encryption:
    enabled: false
    scheme: "CKKS"
    poly_modulus_degree: 8192
    coeff_mod_bit_sizes: [60, 40, 40, 60]
    global_scale_exp: 40
    chunk_size: 4096
