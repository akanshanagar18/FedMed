apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fedmed-ingress
  namespace: fedmed-system
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
  - host: fedmed.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: fedmed-backend-service
            port:
              number: 8000
